bind r source-file ~/.tmux.conf \; display-message "Reload Config!!"
set-window-option -g mode-keys vi

unbind-key C-b
set-option -g prefix C-t
bind-key C-t send-prefix

#history-limit
set-option -g history-limit 10000

#tmux powerline $pip install powerline-status
run-shell "powerline-daemon -q"
source "~/.pyenv/versions/3.12.0/lib/python3.12/site-packages/powerline/bindings/tmux/powerline.conf"
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

#mouse_mac
set-option -g mouse on

# Pane border
set -g pane-border-style fg=green
set -g pane-active-border-style fg=yellow

set -s escape-time 0

# Required for image.nvim kitty backend
set -g allow-passthrough on

setw -g window-status-activity-style bg="colour16","underscore",fg="colour45"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key -n M-Left resize-pane -L 3
bind-key -n M-Right resize-pane -R 3
bind-key -n M-Up resize-pane -U 3
bind-key -n M-Down resize-pane -D 3

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Use vim keybindings in copy mode $ brew install reattach-to-user-namespace
setw -g mode-keys vi

# Update default binding of `Enter` to also use copy-pipe
unbind -Tcopy-mode-vi Enter

# Setup 'v' to begin selection as in Vim
bind -Tcopy-mode-vi v send -X begin-selection
bind -Tcopy-mode-vi y send -X copy-pipe "reattach-to-user-namespace pbcopy"
